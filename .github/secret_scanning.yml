# Exclude vendored third-party bundles from GitHub secret scanning.
#
# vendor/transformers.bundle.mjs is a generated esbuild bundle of
# @huggingface/transformers + onnxruntime-web. Its model-architecture name tables
# (e.g. "Mistral3ForConditionalGeneration") trip provider credential detectors even
# though they contain no secrets. These files are build output / third-party code,
# not somewhere we author credentials.
paths-ignore:
  - "vendor/**"
