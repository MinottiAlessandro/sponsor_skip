<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ad_skip offscreen detector</title>
  </head>
  <body>
    <!-- Hidden offscreen document: hosts the Transformers.js model and runs
         inference. Service workers can't hold a 129 MB model in memory across
         their short lifecycle, so detection lives here. -->
    <!-- ORT is bundled into vendor/transformers.bundle.mjs (esbuild). Under MV3 CSP
         extensions have no bundler or import-map, so Transformers.js's bare ORT
         imports (e.g. "onnxruntime-web/webgpu") are resolved at build time into that
         single module, which offscreen.js then dynamically imports. -->
    <script type="module" src="offscreen.js"></script>
  </body>
</html>
