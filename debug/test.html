<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ad_skip — on-device model test</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
      textarea { width: 100%; height: 180px; font-family: monospace; font-size: 12px; }
      button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
      #out { white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 6px; margin-top: 12px; }
      .ok { color: #2e7d32; font-weight: 600; }
      .err { color: #c62828; font-weight: 600; }
      .muted { color: #777; }
    </style>
  </head>
  <body>
    <h1>On-device model test</h1>
    <p class="muted">
      Runs the bundled detector through the real path (background → offscreen → model).
      Verifies in-browser inference independent of the live YouTube transcript fetch.
      One cue per line, format: <code>start_seconds | text</code>.
    </p>
    <textarea id="cues"></textarea>
    <p>
      <button id="run">Run on-device detection</button>
      <span id="spin" class="muted"></span>
    </p>
    <div id="out" class="muted">Results will appear here.</div>
    <script src="test.js"></script>
  </body>
</html>
